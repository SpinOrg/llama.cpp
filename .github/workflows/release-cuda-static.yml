name: ReleaseCudaStatic

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create or update release'
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CUDA_IMAGE: nvidia/cuda:12.6.2-devel-ubuntu24.04
  CMAKE_ARGS: "-DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_MTMD=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_TOOLS_INSTALL=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_OPENSSL=OFF -DGGML_RPC=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=dist"

jobs:
  ubuntu-cuda:
    runs-on: [self-hosted, ubuntu-latest]

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Docker
        id: docker_check
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker version

      - name: Configure, build, install, and pack in CUDA container
        id: cmake_build
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            --env CMAKE_ARGS="${CMAKE_ARGS}" \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            "${CUDA_IMAGE}" \
            bash -lc '
              set -euo pipefail

              apt-get update -y
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                git \
                libgomp1 \
                ninja-build \
                pkg-config \
                zip

              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_RPATH=\$ORIGIN \
                -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
                -DGGML_BACKEND_DL=OFF \
                -DGGML_NATIVE=OFF \
                -DGGML_CPU_ALL_VARIANTS=OFF \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_CUB_3DOT2=ON \
                ${CMAKE_ARGS}
              cmake --build build --config Release --parallel "$(nproc)"
              cmake --install build --config Release

              ls ./dist
              if [ -f ./dist/lib/libllama-common.a ] && [ ! -e ./dist/lib/libcommon.a ]; then
                cp ./dist/lib/libllama-common.a ./dist/lib/libcommon.a
              fi
              if [ -f ./dist/lib/libllama-common-base.a ] && [ ! -e ./dist/lib/libcommon-base.a ]; then
                cp ./dist/lib/libllama-common-base.a ./dist/lib/libcommon-base.a
              fi
              cp LICENSE ./dist/
              zip -r llama-bin-ubuntu-cuda-x64.zip ./dist/*

              chown -R "${HOST_UID}:${HOST_GID}" build dist llama-bin-ubuntu-cuda-x64.zip
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: llama-bin-ubuntu-cuda-x64.zip
          name: llama-bin-ubuntu-cuda-x64.zip

  release:
    if: ${{ github.event.inputs.create_release == 'true' }}

    permissions:
      contents: write

    runs-on: [self-hosted, ubuntu-latest]

    needs:
      - ubuntu-cuda

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Download artifacts
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifact
          merge-multiple: true

      - name: Move artifacts
        id: move_artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p release

          for zip_file in artifact/*.zip; do
            base_name="$(basename "$zip_file" .zip)"
            zip_name="llama-${{ steps.tag.outputs.name }}-${base_name#llama-}.zip"
            echo "Moving $zip_file to release/$zip_name"
            mv "$zip_file" "release/$zip_name"
          done

          echo "Final release assets:"
          ls -lh release/

      - name: Reuse or create commit release
        id: ensure_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail

          CURRENT_SHA="$(git rev-parse HEAD)"
          RELEASE_TAG=""

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            RELEASE_TAG="${TAG_NAME}"
            echo "Found existing release for tag ${TAG_NAME}."
          else
            echo "No release found for ${TAG_NAME}; checking for an existing release on commit ${CURRENT_SHA}."

            while IFS= read -r tag; do
              if [ -z "${tag}" ]; then
                continue
              fi

              if gh release view "${tag}" >/dev/null 2>&1; then
                RELEASE_TAG="${tag}"
                echo "Reusing existing release ${tag} for commit ${CURRENT_SHA}."
                break
              fi
            done < <(git tag --points-at "${CURRENT_SHA}")
          fi

          if [ -z "${RELEASE_TAG}" ]; then
            echo "No release exists for commit ${CURRENT_SHA}; creating ${TAG_NAME}."

            gh release create "${TAG_NAME}" \
              --target "${CURRENT_SHA}" \
              --title "${TAG_NAME}" \
              --notes "Release ${TAG_NAME}"

            RELEASE_TAG="${TAG_NAME}"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload or replace release assets
        id: upload_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.ensure_release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release/*.zip)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No zip assets found in ./release"
            exit 1
          fi

          echo "Uploading assets to release ${TAG_NAME}:"
          printf '  %s\n' "${assets[@]}"

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
